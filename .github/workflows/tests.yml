name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run automated tests
        run: python -m pytest --cov=trustlens --cov-report=term-missing --cov-fail-under=75

      - name: Check code quality
        run: >-
          ruff check src tests scripts app.py &&
          ruff format --check src tests scripts app.py

      - name: Audit Python dependencies
        run: pip-audit

      - name: Verify benchmark command
        run: trustlens-benchmark --folds 2 --output benchmark-smoke-test.json

      - name: Verify controlled benchmark suite
        run: >-
          trustlens-benchmark-suite --folds 2 --resamples 100
          --output controlled-suite-smoke-test.json
          --report controlled-suite-smoke-test.md

      - name: Verify public reference benchmark
        run: >-
          trustlens-reference-benchmark --folds 2
          --output reference-benchmark-smoke-test.json
          --report reference-benchmark-smoke-test.md

      - name: Verify locked evidence is unchanged
        run: >-
          git diff --exit-code -- results/final_test_metrics.json
          results/final_test_uncertainty.json results/error_analysis.json
