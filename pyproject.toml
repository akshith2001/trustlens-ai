[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "trustlens-ai"
version = "0.4.0"
description = "Human-governed reliability and explainability auditing for AI systems"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Akshith Moharampudi" }]
keywords = ["responsible-ai", "model-governance", "explainable-ai", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.141.1",
    "matplotlib>=3.11",
    "numpy>=2.3",
    "pandas>=2.3",
    "scikit-learn>=1.7",
    "streamlit>=1.62",
    "uvicorn>=0.41",
]

[project.scripts]
trustlens-benchmark = "trustlens.benchmark:main"
trustlens-benchmark-suite = "trustlens.benchmark_suite:main"
trustlens-reference-benchmark = "trustlens.reference_benchmark:main"
trustlens-external-validation = "trustlens.external_validation:main"

[project.optional-dependencies]
dev = [
    "build>=1.5",
    "httpx>=0.28",
    "pip-audit>=2.10.1",
    "pytest>=8.4",
    "pytest-cov>=7.1",
    "ruff>=0.16.4",
]

[project.urls]
Homepage = "https://github.com/akshith2001/trustlens-ai"
Documentation = "https://github.com/akshith2001/trustlens-ai#readme"
Repository = "https://github.com/akshith2001/trustlens-ai"
Issues = "https://github.com/akshith2001/trustlens-ai/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["reports", "results", "figures"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.poetry]
packages = [{ include = "trustlens", from = "src" }]
